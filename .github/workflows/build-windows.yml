name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Package Windows application
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Build executable
        run: >-
          uv run pyinstaller --noconfirm --clean --windowed --onedir
          --name "attendance-tool" --icon "assets/app.ico" main.py

      - name: Create distribution archive
        shell: pwsh
        run: Compress-Archive -Path "dist/attendance-tool" -DestinationPath "dist/attendance-tool-windows.zip"

      - name: Upload Windows package
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: attendance-tool-windows
          path: dist/attendance-tool-windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "dist/attendance-tool-windows.zip"
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $asset --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $asset --title $env:GITHUB_REF_NAME --generate-notes
          }
